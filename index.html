<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gotta Chat Fast</title>
<style>
  :root{
    --cobalt-900:#0a1a3d;
    --cobalt-700:#123a8c;
    --cobalt-500:#1b56d6;
    --sky-300:#8fc7ff;
    --gold-400:#ffcf40;
    --red-500:#e8402a;
    --cream:#eef4ff;
    --ink:#081026;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(143,199,255,0.15), transparent 40%),
      linear-gradient(160deg, var(--cobalt-900) 0%, var(--ink) 70%);
    color:var(--cream);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
    position:relative;
  }
  .speedlines{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    opacity:0.35;
    background-image: repeating-linear-gradient(
      100deg,
      transparent 0 60px,
      rgba(143,199,255,0.06) 60px 62px
    );
    animation: dash 6s linear infinite;
  }
  @keyframes dash{
    from{background-position-x:0;}
    to{background-position-x:-600px;}
  }
  .app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:560px;
    background:linear-gradient(180deg, rgba(18,58,140,0.55), rgba(8,16,38,0.85));
    border:1px solid rgba(143,199,255,0.25);
    border-radius:20px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    overflow:hidden;
    backdrop-filter: blur(6px);
  }
  header{
    padding:22px 24px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    border-bottom:1px solid rgba(143,199,255,0.18);
    background:linear-gradient(90deg, rgba(232,64,42,0.12), transparent 60%);
  }
  .badge{
    width:46px;
    height:46px;
    border-radius:50%;
    background: radial-gradient(circle at 32% 30%, var(--sky-300), var(--cobalt-500) 55%, var(--cobalt-900) 100%);
    flex-shrink:0;
    position:relative;
    box-shadow:0 0 0 3px rgba(255,207,64,0.9), 0 4px 14px rgba(0,0,0,0.4);
  }
  .badge::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background: repeating-conic-gradient(from 0deg, transparent 0 24deg, rgba(8,16,38,0.35) 24deg 30deg);
  }
  header h1{
    margin:0;
    font-size:1.35rem;
    letter-spacing:0.01em;
    font-weight:700;
    color:var(--gold-400);
    text-shadow:0 2px 0 rgba(0,0,0,0.35);
  }
  header p{
    margin:2px 0 0;
    font-size:0.85rem;
    color:var(--sky-300);
  }
  .thread{
    height:56vh;
    min-height:340px;
    overflow-y:auto;
    padding:20px 20px 8px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .thread::-webkit-scrollbar{width:8px;}
  .thread::-webkit-scrollbar-thumb{background:rgba(143,199,255,0.25); border-radius:8px;}
  .msg{
    max-width:82%;
    padding:11px 15px;
    border-radius:16px;
    line-height:1.42;
    font-size:0.96rem;
    animation: pop 0.18s ease-out;
  }
  @keyframes pop{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .msg.user{
    align-self:flex-end;
    background:linear-gradient(135deg, var(--cobalt-500), var(--cobalt-700));
    color:var(--cream);
    border-bottom-right-radius:4px;
  }
  .msg.bot{
    align-self:flex-start;
    background:rgba(238,244,255,0.08);
    border:1px solid rgba(255,207,64,0.35);
    color:var(--cream);
    border-bottom-left-radius:4px;
  }
  .msg.bot .name{
    display:block;
    font-size:0.72rem;
    font-weight:700;
    color:var(--gold-400);
    margin-bottom:3px;
    letter-spacing:0.02em;
  }
  .typing{
    align-self:flex-start;
    display:flex;
    gap:5px;
    padding:12px 16px;
    background:rgba(238,244,255,0.08);
    border:1px solid rgba(255,207,64,0.35);
    border-radius:16px;
    border-bottom-left-radius:4px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--sky-300);
    animation:bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:0.15s;}
  .typing span:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0); opacity:0.5;}
    30%{transform:translateY(-5px); opacity:1;}
  }
  form{
    display:flex;
    gap:10px;
    padding:16px 18px 20px;
    border-top:1px solid rgba(143,199,255,0.18);
  }
  input[type=text]{
    flex:1;
    padding:12px 15px;
    border-radius:12px;
    border:1px solid rgba(143,199,255,0.3);
    background:rgba(8,16,38,0.55);
    color:var(--cream);
    font-size:0.96rem;
    outline:none;
    transition:border-color 0.15s, box-shadow 0.15s;
  }
  input[type=text]:focus{
    border-color:var(--gold-400);
    box-shadow:0 0 0 3px rgba(255,207,64,0.18);
  }
  input[type=text]::placeholder{color:rgba(238,244,255,0.4);}
  button{
    border:none;
    border-radius:12px;
    padding:0 20px;
    font-weight:700;
    font-size:0.94rem;
    color:var(--ink);
    background:linear-gradient(135deg, var(--gold-400), #ffb020);
    cursor:pointer;
    transition:transform 0.12s ease;
  }
  button:hover{transform:translateY(-1px);}
  button:active{transform:translateY(0px) scale(0.97);}
  button:disabled{opacity:0.5; cursor:not-allowed; transform:none;}
  .error-banner{
    display:none;
    padding:10px 18px;
    background:rgba(232,64,42,0.15);
    border-bottom:1px solid rgba(232,64,42,0.4);
    color:#ffb3a3;
    font-size:0.82rem;
  }
  @media (prefers-reduced-motion: reduce){
    .speedlines{animation:none;}
    .msg{animation:none;}
    .typing span{animation:none;}
  }
</style>
</head>
<body>
<div class="speedlines"></div>

<div class="app">
  <header>
    <div class="badge"></div>
    <div>
      <h1>Gotta Chat Fast</h1>
      <p>a cocky, fast-talking chat buddy</p>
    </div>
  </header>

  <div class="error-banner" id="errorBanner"></div>

  <div class="thread" id="thread">
    <div class="msg bot">
      <span class="name">HIM</span>
      Whoa, hold up — didn't even hear you come in. Name's not important, speed is. What's on your mind?
    </div>
  </div>

  <form id="form">
    <input type="text" id="input" placeholder="Say something..." autocomplete="off" />
    <button type="submit" id="send">Send</button>
  </form>
</div>

<script>
const thread = document.getElementById('thread');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const errorBanner = document.getElementById('errorBanner');

function addMessage(text, sender){
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  if(sender === 'bot'){
    div.innerHTML = '<span class="name">HIM</span>' + escapeHtml(text);
  } else {
    div.textContent = text;
  }
  thread.appendChild(div);
  thread.scrollTop = thread.scrollHeight;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function showTyping(){
  const t = document.createElement('div');
  t.className = 'typing';
  t.id = 'typing-indicator';
  t.innerHTML = '<span></span><span></span><span></span>';
  thread.appendChild(t);
  thread.scrollTop = thread.scrollHeight;
}
function hideTyping(){
  const t = document.getElementById('typing-indicator');
  if(t) t.remove();
}

function showError(msg){
  errorBanner.textContent = msg;
  errorBanner.style.display = 'block';
}
function clearError(){
  errorBanner.style.display = 'none';
}

let history = [];

async function sendMessage(text){
  clearError();
  history.push({role:'user', content:text});
  addMessage(text, 'user');
  input.value = '';
  sendBtn.disabled = true;
  showTyping();

  try{
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });

    hideTyping();

    if(!response.ok){
      throw new Error('Server responded with ' + response.status);
    }

    const data = await response.json();
    const reply = data.reply || '...';
    history.push({role:'assistant', content:reply});
    addMessage(reply, 'bot');
  }catch(err){
    hideTyping();
    showError('Could not reach the server. Is server.js running, and is your API key set in .env?');
    console.error(err);
  }finally{
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if(!text) return;
  sendMessage(text);
});

input.focus();
</script>
</body>
</html>
